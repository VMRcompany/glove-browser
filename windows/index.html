<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Glove Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="tabstrip">
    <div id="tabs"></div>
    <button id="add" class="icon" title="Новая вкладка" type="button">+</button>
    <div class="drag"></div>
    <button id="min" class="win" type="button" title="Свернуть">&#8211;</button>
    <button id="max" class="win" type="button" title="Развернуть">&#9633;</button>
    <button id="close" class="win close" type="button" title="Закрыть">&#10005;</button>
  </header>
  <nav id="toolbar">
    <button id="back" class="icon" type="button" title="Назад">&#8592;</button>
    <button id="forward" class="icon" type="button" title="Вперёд">&#8594;</button>
    <button id="reload" class="icon" type="button" title="Обновить">&#8635;</button>
    <button id="home" class="icon" type="button" title="Главная">&#8962;</button>
    <form id="omnibox">
      <button id="engine" class="engine-btn" type="button" title="Поисковая система"><img alt=""></button>
      <input id="address" type="text" spellcheck="false" placeholder="Введите запрос или адрес" autocomplete="off" />
      <button id="mic" class="lens" type="button" title="Голосовой ввод" aria-label="Голосовой ввод">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a1 1 0 0 0-2 0 3 3 0 0 1-6 0 1 1 0 0 0-2 0 5 5 0 0 0 4 4.9V18H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.1A5 5 0 0 0 17 11z"/></svg>
      </button>
      <button id="camera" class="lens" type="button" title="Поиск по изображению" aria-label="Поиск по изображению">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>
      </button>
      <button id="lens" class="lens" type="submit" title="Найти" aria-label="Найти">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </form>
    <button id="extensions" class="icon" type="button" title="Расширения" aria-label="Расширения">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.5 2.5 0 0 1 0 5H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.5 2.5 0 0 1 5 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
    </button>
    <button id="menu" class="icon" type="button" title="Настройка и управление">&#8942;</button>
  </nav>
  <div id="updateBar" hidden>
    <span>Вышло новое обновление</span>
    <button id="updateClose" type="button" aria-label="Скрыть">×</button>
  </div>
  <div id="suggest" hidden></div>
  <div id="voice" hidden>
    <strong>Glove</strong>
    <p id="voiceText">Слушаю…</p>
    <button id="voiceStop" type="button">Готово</button>
  </div>
  <div id="extPanel" hidden></div>
  <div id="findbar" hidden>
    <input id="findQuery" type="text" placeholder="Найти на странице" />
    <button id="findNext" type="button">Далее</button>
    <button id="findClose" type="button">Закрыть</button>
  </div>
  <div id="enginePicker" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
