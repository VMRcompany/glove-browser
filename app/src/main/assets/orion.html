<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glove Browser</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #e6f1ea; color: #102126; font-family: Georgia, "Iowan Old Style", Palatino, serif; }
  main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 32px 22px 18vh; box-sizing: border-box; }
  .mark { width: 72px; height: 84px; margin: 0 auto 18px; background: #102126; clip-path: polygon(50% 0, 100% 28%, 88% 100%, 12% 100%, 0 28%); }
  h1 { margin: 0; text-align: center; font-weight: 500; letter-spacing: 0.08em; font-size: 34px; }
  p { margin: 8px 0 22px; text-align: center; letter-spacing: 0.18em; text-transform: uppercase; font-size: 12px; font-family: "Segoe UI", sans-serif; color: #1f8a70; }
  form { display: flex; gap: 8px; max-width: 560px; margin: 0 auto; width: 100%; }
  input { flex: 1; border: 0; background: #f7fbf8; color: #102126; font-size: 16px; padding: 14px 16px; font-family: "Segoe UI", sans-serif; }
  button { border: 0; background: #1f8a70; color: #f7fbf8; padding: 0 18px; font-family: "Segoe UI", sans-serif; letter-spacing: 0.08em; }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Glove</h1>
  <p>Orion search</p>
  <form id="q">
    <input name="q" autocomplete="off" placeholder="Search or enter address" />
    <button type="submit">Go</button>
  </form>
</main>
<script>
  document.getElementById("q").addEventListener("submit", function (e) {
    e.preventDefault();
    var value = new FormData(e.target).get("q") || "";
    if (window.Glove && Glove.open) Glove.open(String(value));
  });
</script>
</body>
</html>
